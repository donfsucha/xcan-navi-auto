plugins {
    id "com.android.application"
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(new InputStreamReader(it, "UTF-8")) }
}

def escapedProp = { name ->
    (localProps.getProperty(name, "") ?: "")
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
}

def releaseStoreFile = localProps.getProperty("NAVIAUTO_STORE_FILE", "")
def releaseStorePassword = localProps.getProperty("NAVIAUTO_STORE_PASSWORD", "")
def releaseKeyAlias = localProps.getProperty("NAVIAUTO_KEY_ALIAS", "")
def releaseKeyPassword = localProps.getProperty("NAVIAUTO_KEY_PASSWORD", "")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.xcan.naviauto"
    compileSdk 35

    defaultConfig {
        applicationId "com.xcan.naviauto"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.0.2"

        buildConfigField "String", "KAKAO_NATIVE_APP_KEY", "\"${escapedProp("KAKAO_NATIVE_APP_KEY")}\""
        buildConfigField "String", "NAVER_MAP_CLIENT_ID", "\"${escapedProp("NAVER_MAP_CLIENT_ID")}\""
        buildConfigField "String", "TMAP_APP_KEY", "\"${escapedProp("TMAP_APP_KEY")}\""
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${escapedProp("GOOGLE_MAPS_API_KEY")}\""

        manifestPlaceholders = [
                GOOGLE_MAPS_API_KEY: escapedProp("GOOGLE_MAPS_API_KEY")
        ]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.kakao.sdk:v2-navi:2.20.1"
    implementation "com.google.android.gms:play-services-maps:19.0.0"
}
